name: 🚀 Deploy Frontend (Prod)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: agri-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      # ── CHECKOUT ──────────────────────────────────────────────────────────
      - name: 🧾 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── AUTH (Workload Identity Federation) ──────────────────────────────
      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: ☁️ Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      # ── VERSIONING (vX.Y.Z) ───────────────────────────────────────────────
      - name: 🏷️ Generate PROD semantic version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          PREFIX="v"
          LAST_TAG=$(git tag -l "${PREFIX}[0-9]*.[0-9]*.[0-9]*" \
            | sort -V \
            | tail -n 1)
          if [ -z "$LAST_TAG" ]; then
            VERSION="${PREFIX}1.0.0"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LAST_TAG#${PREFIX}}"
            PATCH=$((PATCH + 1))
            VERSION="${PREFIX}${MAJOR}.${MINOR}.${PATCH}"
          fi
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "ERROR: Tag ${VERSION} already exists."
            exit 1
          fi
          # Cloud Run revision suffixes must start with a letter.
          SAFE_VERSION="${VERSION//./-}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "SAFE_VERSION=${SAFE_VERSION}" >> "$GITHUB_ENV"
          echo "Production version: ${VERSION}"
          echo "Revision suffix: ${SAFE_VERSION}"

      # ── DOCKER AUTH ───────────────────────────────────────────────────────
      - name: 🔐 Configure Docker for Artifact Registry
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${{ vars.REGION }}-docker.pkg.dev" --quiet

      # ── BUILD & PUSH ──────────────────────────────────────────────────────
      - name: 🐳 Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.REPO_NAME }}/${{ vars.REPO_NAME }}:${{ env.VERSION }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

      # ── DEPLOY ────────────────────────────────────────────────────────────
      - name: 🚀 Deploy to Cloud Run (Prod)
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "${{ vars.SERVICE_NAME }}-prod" \
            --image "${{ vars.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.REPO_NAME }}/${{ vars.REPO_NAME }}:${VERSION}" \
            --region "${{ vars.REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "${{ secrets.WIF_SERVICE_ACCOUNT }}" \
            --revision-suffix "${SAFE_VERSION}"

      # ── GIT TAG ───────────────────────────────────────────────────────────
      - name: 🏷️ Create PROD Git tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "ERROR: Remote tag ${VERSION} already exists."
            exit 1
          fi
          git tag "${VERSION}"
          git push origin "refs/tags/${VERSION}"

      # ── SUMMARY ───────────────────────────────────────────────────────────
      - name: 📋 Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Frontend Production Deployment"
            echo ""
            echo "- **Status:** ${{ job.status }}"
            echo "- **Version:** ${{ env.VERSION }}"
            echo "- **Service:** ${{ vars.SERVICE_NAME }}-prod"
            echo "- **Region:** ${{ vars.REGION }}"
          } >> "$GITHUB_STEP_SUMMARY"
