name: 🚀 Deploy Frontend (Production)

on:
  push:
    branches:
      - main

  workflow_dispatch:

# Prevent multiple production deployments at the same time
concurrency:
  group: frontend-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:

  # ============================================================
  # 1. VALIDATION + SECURITY CHECKS
  # ============================================================
  security:
    name: 🔐 Validation & Security Scan
    runs-on: ubuntu-latest
    environment: main

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------
      - name: 🧾 Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # POKA-YOKE: REQUIRED FILE CHECK
      # --------------------------------------------------------
      - name: 🛡️ Validate required files
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking required project files..."

          REQUIRED_FILES=(
            "Dockerfile"
            "package.json"
            "package-lock.json"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "❌ Missing required file: $FILE"
              exit 1
            fi

            echo "✅ Found: $FILE"
          done

          echo "✅ Required file validation passed"

      # --------------------------------------------------------
      # POKA-YOKE: DOCKERFILE CHECK
      # --------------------------------------------------------
      - name: 🐳 Validate Dockerfile
        shell: bash
        run: |
          set -euo pipefail

          grep -q "^FROM " Dockerfile || {
            echo "❌ Dockerfile does not contain FROM"
            exit 1
          }

          echo "✅ Dockerfile contains FROM"

          if grep -q "EXPOSE 8080" Dockerfile; then
            echo "✅ Dockerfile exposes port 8080"
          else
            echo "⚠️ WARNING: Dockerfile does not expose port 8080"
          fi

      # --------------------------------------------------------
      # GITLEAKS
      # --------------------------------------------------------
      - name: 🔑 Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      # --------------------------------------------------------
      # HADOLINT
      # --------------------------------------------------------
      - name: 🐳 Scan Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      # --------------------------------------------------------
      # NODE.JS
      # --------------------------------------------------------
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      # --------------------------------------------------------
      # INSTALL DEPENDENCIES
      # --------------------------------------------------------
      - name: 📦 Install dependencies
        run: |
          set -euo pipefail

          npm ci

      # --------------------------------------------------------
      # FRONTEND BUILD TEST
      # --------------------------------------------------------
      - name: 🏗️ Build frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
        run: |
          set -euo pipefail

          npm run build

          echo "✅ Frontend build successful"


  # ============================================================
  # 2. BUILD + SCAN + PUSH DOCKER IMAGE
  # ============================================================
  build:
    name: 🐳 Build & Scan Docker Image
    runs-on: ubuntu-latest
    environment: main

    needs:
      - security

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------
      - name: 🧾 Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # AUTHENTICATE TO GOOGLE CLOUD
      # --------------------------------------------------------
      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # --------------------------------------------------------
      # SETUP GCLOUD
      # --------------------------------------------------------
      - name: ☁️ Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      # --------------------------------------------------------
      # DOCKER AUTH
      # --------------------------------------------------------
      - name: 🔐 Configure Docker
        run: |
          set -euo pipefail

          gcloud auth configure-docker \
            "${{ vars.REGION }}-docker.pkg.dev" \
            --quiet

      # --------------------------------------------------------
      # PREPARE IMAGE
      # --------------------------------------------------------
      - name: 🏷️ Prepare Docker image name
        id: image
        shell: bash
        run: |
          set -euo pipefail

          SHORT_SHA=$(git rev-parse --short HEAD)

          IMAGE="${{ vars.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.REPO_NAME }}/frontend:${SHORT_SHA}"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

          echo "Docker Image:"
          echo "$IMAGE"

      # --------------------------------------------------------
      # BUILD IMAGE
      # --------------------------------------------------------
      - name: 🏗️ Build Docker image
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
        run: |
          set -euo pipefail

          docker build \
            --pull \
            --build-arg "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL" \
            --build-arg "NEXT_PUBLIC_FIREBASE_API_KEY=$NEXT_PUBLIC_FIREBASE_API_KEY" \
            --build-arg "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN" \
            --build-arg "NEXT_PUBLIC_FIREBASE_PROJECT_ID=$NEXT_PUBLIC_FIREBASE_PROJECT_ID" \
            --build-arg "NEXT_PUBLIC_FIREBASE_APP_ID=$NEXT_PUBLIC_FIREBASE_APP_ID" \
            -t "$IMAGE" \
            .

          echo "✅ Docker image built successfully"

      # --------------------------------------------------------
      # TRIVY
      # --------------------------------------------------------
      - name: 🔎 Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          scanners: vuln

      # --------------------------------------------------------
      # PUSH IMAGE
      # --------------------------------------------------------
      - name: 📦 Push Docker image
        run: |
          set -euo pipefail

          docker push "$IMAGE"

          echo "✅ Docker image pushed successfully"


  # ============================================================
  # 3. DEPLOY TO CLOUD RUN
  # ============================================================
  deploy:
    name: 🚀 Deploy Frontend to Cloud Run
    runs-on: ubuntu-latest
    environment: main

    needs:
      - build

    steps:

      # --------------------------------------------------------
      # AUTHENTICATE
      # --------------------------------------------------------
      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # --------------------------------------------------------
      # SETUP GCLOUD
      # --------------------------------------------------------
      - name: ☁️ Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      # --------------------------------------------------------
      # DEPLOY CLOUD RUN
      # --------------------------------------------------------
      - name: 🚀 Deploy to Cloud Run
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail

          echo "Deploying image:"
          echo "$IMAGE"

          gcloud run deploy "${{ vars.SERVICE_NAME }}" \
            --image "$IMAGE" \
            --region "${{ vars.REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "${{ secrets.CLOUDRUN_SA }}" \
            --set-env-vars="NODE_ENV=production"

          echo "✅ Cloud Run deployment completed"

      # --------------------------------------------------------
      # HEALTH CHECK
      # --------------------------------------------------------
      - name: ❤️ Cloud Run health check
        shell: bash
        run: |
          set -euo pipefail

          URL=$(
            gcloud run services describe "${{ vars.SERVICE_NAME }}" \
              --region "${{ vars.REGION }}" \
              --format='value(status.url)'
          )

          echo "Cloud Run URL:"
          echo "$URL"

          echo "Checking application health..."

          for i in {1..12}; do

            HTTP_CODE=$(curl \
              -L \
              -s \
              -o /dev/null \
              -w "%{http_code}" \
              --max-time 20 \
              "$URL" || true)

            echo "Attempt $i → HTTP $HTTP_CODE"

            if [[ "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]; then
              echo "✅ Cloud Run health check passed"
              exit 0
            fi

            sleep 10
          done

          echo "❌ Cloud Run health check failed"
          exit 1


  # ============================================================
  # 4. CREATE PRODUCTION TAG
  # ============================================================
  tag:
    name: 🏷️ Create Git Tag
    runs-on: ubuntu-latest
    environment: main

    needs:
      - deploy

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------
      - name: 🧾 Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # CREATE TAG
      # --------------------------------------------------------
      - name: 🏷️ Create Git Tag
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          PREFIX="prod-v"

          LAST_TAG=$(
            git tag -l "${PREFIX}[0-9]*.[0-9]*.[0-9]*" |
            sort -V |
            tail -n 1
          )

          if [ -z "$LAST_TAG" ]; then
            VERSION="${PREFIX}1.0.0"
          else
            CURRENT_VERSION="${LAST_TAG#${PREFIX}}"

            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

            PATCH=$((PATCH + 1))

            VERSION="${PREFIX}${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "Creating tag: $VERSION"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if git tag -l "$VERSION" | grep -qx "$VERSION"; then
            echo "⚠️ Tag already exists: $VERSION"
            exit 0
          fi

          git tag "$VERSION"
          git push origin "$VERSION"

          echo "✅ Production tag created: $VERSION"